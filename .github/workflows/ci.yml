name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned exactly, because a coverage threshold is a property of the engine that
  # counts it: V8's branch accounting changed inside the 22.x line, and this suite
  # reported `audit-policy` at 95.45% branches on 22.13.1 against 93.48% on 22.23.4
  # from the same commit. A floor that drifts with the runtime is a floor that fails
  # on the day of a patch release, for no change in the code it measures.
  NODE_VERSION: "22.13.1"
  # The suites route their scratch data to /dev/shm (tmpfs) when it is
  # available, because a durable commit costs ~19ms on the workspace volume
  # versus ~0.03ms on tmpfs — the difference between a 30s and a 30min load
  # test. `DBSTACK_TEST_TMPDIR` pins the location if the default must change.
  DBSTACK_TEST_TMPDIR: ""

jobs:
  # ── Static analysis ────────────────────────────────────────────────
  typecheck:
    name: Typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: node
          - package: cluster # needs the node build: the assemblers import its autoscaler types
          - package: federation # needs both builds
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo builds the workspace dependencies of the target package first.
      # A plain `pnpm --filter ... run build` runs the dependencies in parallel
      # and a dependent package then typechecks against half-written dist
      # output (TS2307 on the `core/types` subpath).
      - name: Typecheck (builds workspace dependencies first)
        run: pnpm turbo run typecheck --filter=./${{ matrix.package }}
      # The suite is code too. Until this step existed, 910 type errors were
      # sitting in the three test trees — tests configuring options the product
      # never reads, asserting on properties that do not exist, importing
      # modules that are not there. Every one of them was invisible because
      # nothing compiled the tests. Same compiler options, tests included.
      - name: Typecheck the test tree (tests are code)
        run: pnpm --filter ./${{ matrix.package }} run typecheck:tests

  # ── Style gates ────────────────────────────────────────────────────
  #
  # These were previously absent, which is how `lint` silently decayed into a
  # two-rule stub without a TypeScript parser in two of the three packages. A
  # gate that is not executed is not a gate.
  quality:
    name: Quality (lint + format)
    runs-on: ubuntu-latest
    # The gate self-tests run twice on purpose: once plain, once under Node's
    # coverage, so that the coverage of a gate is a measured fact. That is the
    # longest step here, and ten minutes did not leave room for it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Structural gate check (no orphan configs, no scripts pointing at air)
        run: pnpm check:gates
      - name: The pre-push hook exists, is executable, and runs the gate
        run: pnpm check:hooks
      - name: Gate self-tests (a gate that is not tested is a script that prints "passed")
        run: pnpm test:scripts
      - name: The gate self-tests cover the gates
        run: pnpm check:script-coverage
      - name: English-only comments and test titles
        run: pnpm check:english
      - name: No CommonJS require() in ESM packages (it passes tests, fails consumers)
        run: pnpm check:esm-require
      - name: API reference names only symbols the packages export
        run: pnpm check:docs-api
      - name: Every fenced example type-checks against the API it names
        run: pnpm check:doc-examples
      - name: Every type a public signature names is importable from the package root
        run: pnpm check:public-types
      - name: Every script invokes a binary that is installed
        run: pnpm check:script-bins
      - name: No source imports a retired 1.x name, and the migration page matches the exports
        run: pnpm check:legacy-names
      - name: ESLint (one shared config for the whole workspace)
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Prettier on the files no package owns (scripts, workflows, root pages)
        run: pnpm format:check:repo

  # ── Unit tests (fast, isolated) ────────────────────────────────────
  unit:
    name: Unit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [node, cluster, federation]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./${{ matrix.package }}" run test:unit

  # ── Engine conformance (the published storage-engine contract) ────
  #
  # The suite lives inside the cluster test tree, so it also runs in `coverage`.
  # This job exists so that "the contract still holds for every engine" is a
  # first-class result on the run summary — and so that excluding the file from
  # the aggregate run cannot go unnoticed.
  engine-conformance:
    name: Engine conformance (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: memory-reference
            filter: "MemoryStorageEngine"
          - engine: sqlite-durable
            filter: "SqliteKeyValueEngine"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the conformance suite
        working-directory: cluster
        run: npx vitest run src/__tests__/engines --reporter=verbose -t "${{ matrix.filter }}"

  # ── Integration tests (Raft groups, CDC pipelines, chaos) ─────────
  integration:
    name: Integration (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        package: [node, cluster, federation]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./${{ matrix.package }}" run test:integration

  # ── Coverage: one job per package, gated on every dimension ──────
  coverage:
    name: Coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        package: [node, cluster, federation]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./${{ matrix.package }}" run coverage
      - name: Enforce per-dimension threshold (95%)
        run: |
          node -e "
            const summary = require('./${{ matrix.package }}/coverage/coverage-summary.json');
            const dims = ['lines','statements','functions','branches'];
            const bad = dims.filter(d => summary.total[d].pct < 95);
            for (const d of dims) console.log('TOTAL'.padEnd(11), d.padEnd(11), summary.total[d].pct + '%');

            // Report the weakest files explicitly: a package total can hide a module
            // that no test touches, which is exactly the failure mode a gate exists to catch.
            const rows = Object.entries(summary)
              .filter(([file]) => file !== 'total')
              .map(([file, v]) => ({ file, pct: Math.min(...dims.map(d => v[d].pct)) }))
              .sort((a, b) => a.pct - b.pct)
              .slice(0, 10);
            for (const r of rows) console.log('weakest'.padEnd(11), String(r.pct).padEnd(11), r.file.replace(process.cwd(), '.'));

            if (bad.length) { console.error('FAILED dimensions: ' + bad.join(', ')); process.exit(1); }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: ${{ matrix.package }}/coverage/
          retention-days: 14

  coverage-gate:
    name: Coverage gate (all packages)
    needs: [coverage, coverage-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: .
      - name: Restore per-package report layout
        run: |
          # `coverage-<dir>` artifacts are restored verbatim into `<dir>/coverage`,
          # so the gate reads exactly the same paths locally and in CI.
          for artifact in coverage-*; do
            [ -d "$artifact" ] || continue
            pkg="${artifact#coverage-}"
            mkdir -p "$pkg/coverage"
            cp -r "$artifact/." "$pkg/coverage/"
          done
      - run: node scripts/coverage-gate.mjs 95
      - name: The page's test counts are the counts the run produced
        run: node scripts/check-test-counts.mjs

  # ── End-to-end: real multi-process clusters over mTLS ────────────
  #
  # These are the acceptance suites the migration is judged by: real OS
  # processes, real TLS 1.3 handshakes, real mTLS peer verification. Nothing is
  # mocked and nothing runs in-process.
  e2e-cluster:
    name: E2E — Raft cluster over mTLS (real processes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (E2E loads the published dist)
        run: pnpm build
      - name: Verify published entry points are importable
        run: node scripts/check-package.mjs
      # The harness is what every acceptance result below depends on, so its own
      # contract is checked first: a harness that resolves a promise too early or
      # stops reading a child's stdout produces confident, meaningless passes.
      - name: Harness contract (no cluster, seconds)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:harness
      - name: Raft cluster over mTLS (AC-C1..C6)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:cluster
      # Own invocation, not a third file in the same vitest process: this suite
      # restarts every node and drives snapshots every 15 entries, and running it
      # beside two other multi-process clusters made the result depend on how many
      # sibling processes were live rather than on the code.
      - name: Engine durability across restart (AC-C7..C9)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:engine
      # The same three processes again, driven through a *scaling* plan rather than
      # a write: the member set an executor reads is the committed configuration,
      # and a suite that no job invoked would have been green in the coverage run
      # and absent from every job that keeps its own logs.
      - name: Shard scaling against a committed configuration (AC-C25..C27)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:scaling
      # The three published features that once shipped green while broken (a
      # `require` in an ESM artefact, a trace id lost across an async boundary, a
      # subscription pump that delivered to no sink). They used to live inside the
      # packaging gate, whose own tests run in a job with no `dist/` — so they were
      # the part of a gate no test could reach. Here there is a build, and the probe
      # resolves the package by name, which is one step further than the gate goes.
      - name: Published artefacts behave (AC-P1..P2)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:artefact
      # Five voters, six processes, real signals. A configuration change is the one
      # operation whose answer depends on how the *other* processes reply, so it is
      # the one operation no single-node test can judge.
      - name: Membership change in a five-voter cluster (AC-C10..C14)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:membership
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cluster-logs
          path: e2e/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  e2e-federation:
    name: E2E — cross-cluster sync over mTLS (two real DCs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (E2E loads the published dist)
        run: pnpm build
      - name: Cross-cluster sync over mTLS (AC-F1..F5)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:federation
      # An edge replica driven by a real TLS socket in a second process: a
      # custom resolver changes the outcome of a genuine two-writer conflict,
      # and the case fails if the resolver is never consulted (AC-F13, P3-82).
      - name: Edge CDC intake over mTLS (AC-F13)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:edge
      # Its own invocation: this suite kills a quorum and cold-restarts nodes to
      # supersede a fencing token, so it needs the machine to itself for the
      # election timings to mean anything (AC-F22).
      - name: Stale fencing token refused by the resource (AC-F22)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:fencing
      # Its own invocation: this suite kills a datacenter and cold-restarts it,
      # and the restart has to be the only thing competing for the machine's
      # sockets and CPU if the recovery timings are to mean anything.
      - name: Retry window, dead letters and cold restart (AC-F6..F7)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:recovery
      # A log written by one process, tailed by another, shipped over TLS, and
      # delivered to a real HTTP receiver — the CDC path end to end, with the
      # conservation identity read from the process that ran.
      - name: CDC from a real log to a real sink (AC-C15..C19)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:cdc
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-federation-logs
          path: e2e/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  # ── E2E: the operations layer in real processes ───────────────────
  #
  # A durability recipe is only ever observed by a process that died, so the
  # audit trail is written by one process, killed with SIGKILL, and read by a
  # second one. In-process cases cannot ask that question: `close()` runs the
  # code a crash skips.
  e2e-operations:
    name: E2E — operations against real processes (SIGKILL, rotation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (E2E loads the published dist)
        run: pnpm build
      - name: Audit trail across a kill, a rotation and a half-written archive (AC-O1..O3)
        run: pnpm --filter @agentix-e/db-stack-e2e run test:operations
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-operations-logs
          path: e2e/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  # ── E2E harness coverage ──────────────────────────────────────────
  #
  # The harness is production code: it mints certificates, supervises child
  # processes and parses their IPC. It is excluded from the `coverage` matrix
  # because a full coverage run of every acceptance suite costs ~20 minutes on
  # its own, and included here so that it is still gated on all four dimensions
  # rather than trusted.
  coverage-e2e:
    name: Coverage (e2e harness)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (the harness loads the published dist)
        run: pnpm build
      - run: pnpm --filter @agentix-e/db-stack-e2e run coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: e2e/coverage/
          retention-days: 14
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-logs
          path: e2e/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  # ── Load / fault-injection tier ───────────────────────────────────
  #
  # Throughput and fault-boundary suites (connection storms, log compaction
  # under load, backoff under mass proposal, federation pipeline throughput).
  # They assert wall-clock budgets and are therefore separated from the PR
  # gate, but still run on every push so a throughput regression is caught.
  load:
    name: Load & fault boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentix-e/db-cluster run test:load
      - run: pnpm --filter @agentix-e/db-federation run test:perf

  # ── Performance tier ──────────────────────────────────────────────
  #
  # The cluster performance suite asserts budgets (proposal latency, throughput,
  # read-index cost, bounded retained log, heap per proposal) on a real 3-node
  # mTLS cluster. It is separated from the unit/integration tiers because the
  # numbers depend on the runner, and run on every push so a regression is caught
  # by the commit that caused it.
  #
  # Until this job existed the script was never invoked by any workflow, and could
  # not have run if it had been: `test:perf` filtered on a directory the vitest
  # config excludes, so it printed "No test files found" and exited 1.
  benchmark:
    name: Benchmark (cluster, real 3-node mTLS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cluster performance budgets
        run: pnpm --filter @agentix-e/db-cluster run test:perf

  # ── Mutation testing ──────────────────────────────────────────────
  #
  # A green suite says the assertions pass; it does not say they would fail if the
  # behaviour changed. Mutation testing answers that question by changing the code
  # and counting how many alterations the suite notices.
  #
  # This is the only gate in the repository that measures the tests rather than the
  # product, and it immediately found 130 changes in SqliteStorage that no test
  # objected to — including an early return on an empty batch that is never reached.
  #
  # It runs in a sandbox, and the sandbox is a copy of the repository: Stryker copies
  # the working directory, so the run starts at the root — where `tsconfig.base.json`
  # (which every package's tsconfig extends) and `scripts/test-tmpdir.mjs` (which
  # every `vitest.setup.ts` imports) both are. Running in place was how this job used to
  # get past their absence, and it made the score a floor rather than a measurement:
  # a worker's vitest could read a source another worker had already restored. The
  # `--inPlace` flag is now refused by the config itself.
  #
  # One step per target, by name: an aggregate step would leave a failing package
  # indistinguishable from a failing gate.
  mutation:
    name: Mutation (node + cluster + federation)
    runs-on: ubuntu-latest
    # Ninety, not sixty, and the measurement is why the number is not a guess.
    #
    # The cluster target gained `RaftTcpTransport.ts` in iteration 71 — 548 mutants
    # across six suites, one of which drives two real transports over mTLS — and
    # this job measured 31 minutes before the addition and 36 after it (CI
    # 45053900655). Sixty would still have passed. It is nonetheless the wrong cap:
    # the margin that matters is not the one measured today, because this job grows
    # every time a file enters a target, and the runner's speed is not ours to
    # control. A job killed at its cap reports nothing about the mutants it had not
    # reached — the failure names the clock, not a survivor — so the cap is set for
    # the next two additions rather than for this one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation score — cluster
        run: pnpm run test:mutation:cluster
      - name: Mutation score — federation
        run: pnpm run test:mutation:federation
      - name: Mutation score — node
        run: pnpm run test:mutation:node
      # A `Timeout` is not a verdict: it says the runner stopped, not that a test
      # objected. The node target has 43 of them and the cluster target 8, and
      # many are the vitest runner's hit-limit heuristic — a guess at
      # non-termination made from an execution count — rather than a clock. This step reads them: the report and
      # `mutation/timeouts.json` must name each other. A new one fails here with the
      # command that resolves it, and a proof whose mutant no longer exists fails
      # too. Milliseconds, because the replay that produced the file is
      # `scripts/resolve-timeouts.mjs --record`.
      - name: Every timeout has been read
        run: pnpm run check:mutation-timeouts
      # The sandbox is the claim, so the working tree is the evidence. A run that
      # instruments in place leaves modified sources, and one that leaves them is a run
      # whose verdicts came from a file another worker was rewriting.
      - name: The run did not touch the working tree
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the mutation run modified the working tree — it was not sandboxed"
            git status --porcelain
            exit 1
          fi
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: "reports/mutation/*.json"
          if-no-files-found: warn
          retention-days: 14

  # ── Supply chain ──────────────────────────────────────────────────
  security:
    name: Security (SCA + secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm audit --audit-level high` answers "is there a high advisory anywhere?", which is the
      # right question for a release and the wrong one for a repository whose tree holds the test
      # toolchain as well. This checker splits it: production is held to zero with no exceptions, a
      # dev-tree advisory needs a dated entry in `auditPolicy.allow`, and an entry that matches
      # nothing fails the gate so the list cannot rot.
      - name: Dependency audit — production held to zero, dev exceptions named and dated
        run: pnpm audit:policy
      - name: Secret scan — credentials must never be committed
        run: |
          set -euo pipefail
          PATTERN='github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----'
          if git grep -nEI "$PATTERN" -- . ':!*.md' ':!pnpm-lock.yaml'; then
            echo "::error::potential credential committed"
            exit 1
          fi
          echo "No credentials found in tracked files."

  # ── Required-check summary ────────────────────────────────────────
  ci-summary:
    name: CI summary
    if: always()
    needs:
      [
        typecheck,
        quality,
        unit,
        engine-conformance,
        integration,
        coverage,
        coverage-e2e,
        coverage-gate,
        e2e-cluster,
        e2e-federation,
        e2e-operations,
        load,
        benchmark,
        mutation,
        security,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| typecheck | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| quality | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| unit | ${{ needs.unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| engine-conformance | ${{ needs.engine-conformance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| coverage | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| coverage-e2e | ${{ needs.coverage-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| coverage-gate | ${{ needs.coverage-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| e2e-cluster | ${{ needs.e2e-cluster.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| e2e-federation | ${{ needs.e2e-federation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| e2e-operations | ${{ needs.e2e-operations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| load | ${{ needs.load.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| benchmark | ${{ needs.benchmark.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| mutation | ${{ needs.mutation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          for r in "${{ needs.typecheck.result }}" "${{ needs.quality.result }}" "${{ needs.unit.result }}" \
                   "${{ needs.engine-conformance.result }}" "${{ needs.integration.result }}" \
                   "${{ needs.coverage.result }}" "${{ needs.coverage-e2e.result }}" \
                   "${{ needs.coverage-gate.result }}" \
                   "${{ needs.e2e-cluster.result }}" "${{ needs.e2e-federation.result }}" \
                   "${{ needs.e2e-operations.result }}" "${{ needs.load.result }}" \
                   "${{ needs.benchmark.result }}" "${{ needs.mutation.result }}" \
                   "${{ needs.security.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done
